name: Publish NPM Package
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 bundles
      # an older npm, so upgrade before publishing
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Auth comes from the trusted publisher configured on npmjs.com for this
      # repo and workflow, via the id-token permission above. No token needed.
      - run: npm publish --access public
